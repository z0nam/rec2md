# 제주연구원 회의록 표. 회사 hwpx·docx 원본은 레포에 두지 않는다:
# ~/.config/rec2md/templates/ji/form.hwpx 에 두면 이 매핑으로 채운다. 스키마 설명은 docs/templates.md
name = "ji"
title = "회의록"
description = "제주연구원 회의록 (회의일시·연구자·작성자 / 참석자 / 회의장소 / 회의안건 / 회의내용)"
date_style = "ko"
time_sep = " – "
attendee_style = "org"
attendee_role = false

[[fields]]
label = "회의일시"
value = "datetime"
row = 1

[[fields]]
label = "연구자"
value = "owner"
row = 1

[[fields]]
label = "작성자"
value = "author"
row = 1

[[fields]]
label = "참석자"
anchor = "참 석 자"
value = "attendees"

[[fields]]
label = "회의장소"
value = "place"

[[fields]]
label = "회의안건"
value = "agenda"

[[fields]]
label = "회의내용"
value = "content"
block = true
anchor = "내용"     # 실물 양식: "회의내용"(세로 병합) 오른쪽 머리 칸 "내용", 값은 그 아래
where = "below"

[content]
heading = "{n}. "
item = "▶ "
child = "- "
summary = "회의 개요"
tail = ["decisions", "actions", "next_meeting"]

[content.tail_headings]
decisions = "결정사항"
actions = "향후 할 일"
next_meeting = "다음 회의"

[hwpx.styles]
# 회의내용 단계 → 회사 양식(form.hwpx)의 문단 스타일 이름. 실제 회의록의 쓰임: 상위 항목 "■", 하위 항목 "-_하위본문".
# 두 스타일은 글머리표를 스스로 붙이므로 텍스트의 기호(▶, -)는 빠지고 번호(1.)는 남는다.
# 3단(내용)은 하위본문을 2000(HWPUNIT)만큼 더 들여 쓴다. 회사 원본이 없으면 같은 이름의 내어쓰기 스타일을 만든다
content = ["■", "-_하위본문", { style = "-_하위본문", indent = 2000 }]

[docx.styles]
# 회의내용 단계 → docx 문단 스타일. hwpx와 같이 하위 단계는 글머리표 목록 스타일(기호는 스타일이 붙임)
content = ["회의내용 1단", "List Bullet", "List Bullet 2"]
